server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

metrics_generator:
  storage:
    path: /tmp/tempo/generator
  ring:
    kvstore:
      store: memberlist
  registry:
    collection_interval: 15s
  traces_storage:
    path: /tmp/tempo/generator/traces

memberlist:
  bind_addr: [0.0.0.0]
  bind_port: 7946
  join_members: [tempo:7946]   # Single-Binary darf sich selbst joinen

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks, span-metrics, service-graphs]

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# optional, aber gültig
ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h
