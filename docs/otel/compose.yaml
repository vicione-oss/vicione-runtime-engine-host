version: "3.9"
services:
  otelcol:
    image: docker.io/otel/opentelemetry-collector:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector self-metrics
      - "8889:8889"   # Prometheus exporter endpoint
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:Z,ro
    restart: unless-stopped

  tempo:
    image: docker.io/grafana/tempo:latest
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo HTTP API for Grafana
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:Z,ro
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.retention.time=2d"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z,ro
    depends_on: [otelcol]
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yml:Z,ro
    depends_on: [prometheus]
    restart: unless-stopped
